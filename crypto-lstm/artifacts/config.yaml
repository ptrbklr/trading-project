!!python/object:config.schema.Config
artifacts: !!python/object:config.schema.ArtifactsConfig
  base_dir: models
  save_best_only: true
  save_every_n_epochs: 5
data: !!python/object:config.schema.DataConfig
  add_features: true
  close_col: null
  col_names: time,open,high,low,close,volume,trades
  date_col: null
  dir: /Volumes/ext-data/Python/Projects/trading-project/crypto-lstm/data/candles
  futures_columns: null
  futures_path: null
  interval_minutes: 5
  lookback_hours: 720
  predict_returns: true
  reciprocal_source: SOLEUR
  symbol: null
  symbols:
  - BTC
  - ETH
  - SOL
  target_symbol: SOL
  train_split: 0.8
