# Runtime and model configuration
experiment_name: btceth_lstm_15min_v1

data:
  dir: /Volumes/ext-data/Python/Projects/trading-project/crypto-lstm/data/candles
  symbols: ["BTC", "ETH", "SOL"]   # BTC/EUR, ETH/EUR, native ETH/BTC, and USD legs for relative-strength features
  target_symbol: "SOL"             # BTC priced in ETH, derived as the reciprocal of ETHBTC
  reciprocal_source: "SOLEUR"
  interval_minutes: 5
  date_col: null
  close_col: null
  col_names: "time,open,high,low,close,volume,trades"
  add_features: true
  train_split: 0.8
  predict_returns: true

model:
  type: lstm
  hidden_size: 256
  num_layers: 3
  dropout: 0.2
  seq_len: 60
  attention: true
  classification_head: true

training:
  epochs: 100
  batch_size: 64
  lr: 0.001
  grad_clip: 1.0
  optimizer: adam
  scheduler:
    type: reduce_on_plateau
    factor: 0.5
    patience: 10
  early_stopping:
    enabled: true
    patience: 15
    min_delta: 0.0001

loss:
  type: hybrid
  mse_weight: 0.5
  mae_weight: 0.3
  directional_weight: 0.2
  directional_alpha: 0.5
  classification_weight: 0.1
  dir_deadband: 0.1

artifacts:
  base_dir: artifacts
  save_best_only: true
  save_every_n_epochs: 10

# XGBoost configuration (at root level)
use_xgboost: true
ensemble_weight: 0.2
xgboost:
  n_estimators: 150
  max_depth: 8
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  early_stopping_rounds: 20
  verbose: true
  random_state: 42


  features:
  include:
    - log_return
    - return_lag_2
    - return_lag_3
    - return_lag_5

    - btc_log_return
    - btc_return_lag_2
    - btc_return_lag_3
    - btc_return_lag_5
    - btc_return_lag_10s
    - btc_return_lag_20s
    - btc_return_lag_30s

    - eth_log_return
    - eth_return_lag_2
    - eth_return_lag_3
    - eth_return_lag_5
    - eth_return_lag_10s
    - eth_return_lag_20s
    - eth_return_lag_30s
    - volatility_20
    - btc_vol_ma_20
    - btc_vol_ma20_lag_10s
    - btc_vol_ma20_lag_20s

    - eth_vol_ma_20
    - eth_vol_ma20_lag_10s
    - eth_vol_ma20_lag_20s
    - btc_momentum_10
    - btc_momentum10_lag_10s
    - btc_momentum10_lag_20s

    - eth_momentum_10
    - volume_delta

    - btc_volume_delta
    - btc_volume_lag_10s
    - btc_volume_lag_20s

    - eth_volume_delta
    - eth_volume_delta_lag_10s
    - eth_volume_delta_lag_20s

    - eth_trades
    - eth_trades_lag_10s
    - eth_trades_lag_20s
    - return_vol_norm
    - btc_eth_corr_20

