# Runtime and model configuration
experiment_name: btceth_lstm_15min_v1

data:
  dir: data/candles
  symbols: ["BTC", "ETH", "ETHBTC", "BTCUSD", "ETHUSD"]   # BTC/EUR, ETH/EUR, native ETH/BTC, and USD legs for relative-strength features
  target_symbol: "BTCETH"             # BTC priced in ETH, derived as the reciprocal of ETHBTC
  reciprocal_source: "ETHBTC"
  interval_minutes: 60
  date_col: null
  close_col: null
  col_names: "time,open,high,low,close,volume,trades"
  add_features: true
  train_split: 0.8
  predict_returns: true

model:
  type: lstm
  hidden_size: 256
  num_layers: 3
  dropout: 0.2
  seq_len: 60
  attention: true
  classification_head: true

training:
  epochs: 100
  batch_size: 64
  lr: 0.001
  grad_clip: 1.0
  optimizer: adam
  scheduler:
    type: reduce_on_plateau
    factor: 0.5
    patience: 10
  early_stopping:
    enabled: true
    patience: 15
    min_delta: 0.0001

loss:
  type: hybrid
  mse_weight: 0.4
  mae_weight: 0.3
  directional_weight: 0.3
  directional_alpha: 2.0
  classification_weight: 0.1
  dir_deadband: 0.1

artifacts:
  base_dir: artifacts
  save_best_only: true
  save_every_n_epochs: 10
