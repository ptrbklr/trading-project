# config.yaml
experiment_name: "eth_xgboost_ensemble"  # ADD THIS LINE

data:
  dir: "/Volumes/ext-data/Python/Projects/trading-project/crypto-lstm/data/candles"
  symbols: ["BTC", "ETH", "ETHBTC", "BTCUSD", "ETHUSD"]
  interval_minutes: 60
  date_col: "timestamp"
  close_col: "close"
  col_names: "open,high,low,close,volume"
  add_features: true
  train_split: 0.8
  predict_returns: false

model:
  type: "lstm"
  hidden_size: 128
  num_layers: 3
  dropout: 0.2
  seq_len: 60
  attention: true
  classification_head: false

training:
  epochs: 100
  batch_size: 64
  lr: 0.001
  grad_clip: 1.0
  optimizer: "adam"
  seed: 42
  scheduler:
    type: "reduce_on_plateau"
    factor: 0.5
    patience: 10
  early_stopping:
    enabled: true
    patience: 20
    min_delta: 0.0001

loss:
  type: "hybrid"
  mse_weight: 0.5
  mae_weight: 0.3
  directional_weight: 0.2
  directional_alpha: 0.1
  classification_weight: 0.0
  dir_deadband: 0.0

artifacts:
  base_dir: "artifacts/"
  save_best_only: true
  save_every_n_epochs: 10

# XGBoost configuration (at root level)
use_xgboost: true
ensemble_weight: 0.8
xgboost:
  n_estimators: 150
  max_depth: 8
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  early_stopping_rounds: 20
  verbose: true
  random_state: 42